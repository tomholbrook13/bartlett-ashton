name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html", "tombler/**", "snowball/**", "whittle/**", "stowaway/**", "hidden/**", "splice/**", "crossline/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy site files
        run: |
          mkdir -p _site/tombler _site/snowball _site/whittle _site/stowaway _site/hidden _site/splice _site/crossline
          cp index.html _site/
          cp tombler/index.html tombler/puzzles.js tombler/words.js _site/tombler/
          cp snowball/index.html snowball/puzzles.js snowball/words.js _site/snowball/
          cp whittle/index.html _site/whittle/
          cp stowaway/index.html stowaway/puzzles.js _site/stowaway/
          cp hidden/index.html _site/hidden/
          cp splice/index.html splice/puzzles.js _site/splice/
          cp crossline/index.html crossline/data.js crossline/world.js _site/crossline/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
