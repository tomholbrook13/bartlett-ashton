name: Deploy games to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["index.html", "tombler/**", "whittle/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Copy site files
        run: |
          mkdir -p _site/tombler _site/whittle
          cp index.html _site/
          cp tombler/index.html tombler/puzzles.js tombler/words.js _site/tombler/
          cp whittle/index.html whittle/puzzles.js whittle/words.js _site/whittle/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
